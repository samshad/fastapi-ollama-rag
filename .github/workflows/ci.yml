name: CI

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  # ---------------------------------------------------------
  # JOB 1: LINTING & FORMATTING (Runs instantly)
  # ---------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

  # ---------------------------------------------------------
  # JOB 2: RUN PYTEST WITH PGVECTOR DB
  # ---------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint

    # Spin up a temporary Postgres + pgvector database for the tests
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: rag_test_db
        ports:
          - 5432:5432
        # Wait until the database is fully booted before starting the tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Inject environment variables so config.py doesn't crash during validation
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/rag_test_db
      SECRET_KEY: dummy-secret-key-for-github-actions
      OLLAMA_BASE_URL: http://dummy-ollama-url.com
      SMTP_SERVER: dummy.smtp.com
      SMTP_PORT: 587
      SMTP_USERNAME: dummy_user
      SMTP_PASSWORD: dummy_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Pytest
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing
